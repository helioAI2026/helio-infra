[project]
name = "helio-infra"
version = "0.1.0"
description = "Infraestrutura AWS do Helio (CloudFormation + Lambdas)"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.35",
    "moto[dynamodb,sns,sqs]>=5.0",
    "pytest>=8.3",
    "cfn-lint>=1.20",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
